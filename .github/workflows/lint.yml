name: lint
on: pull_request
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      # only the files this PR changes: older files have errors nobody has fixed yet
      - run: pre-commit run --show-diff-on-failure --color always --from-ref "$BASE" --to-ref "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
