exclude: ^sources/patches/
repos:
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v3.12.0.1
    hooks:
      - id: shfmt
      # sourced files have a shebang but no exec bit, so on Linux the shell type misses them
      - id: shfmt
        name: shfmt (sourced files)
        types: [file]
        files: ^sources/(functions/|bash_completion$)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
      - id: shellcheck
        name: shellcheck (sourced files)
        args: ["--severity=error"]
        types: [file]
        files: ^sources/(functions/|bash_completion$)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0 # Use the ref you want to point at
    hooks:
      - id: check-executables-have-shebangs
